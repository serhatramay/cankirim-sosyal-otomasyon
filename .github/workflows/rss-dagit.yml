name: Cankirim RSS Sosyal Dagitim (Bluesky + Mastodon + Facebook + Threads)

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Gercek paylasim yapmadan yalniz kontrol et'
        required: false
        default: false
        type: boolean
      force:
        description: 'Gece molasi ve saatlik bekleme suresini yoksayarak paylas'
        required: false
        default: false
        type: boolean

concurrency:
  group: rss-sosyal-dagitim
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dagit:
    name: RSS Akisini Sosyal Hesaplara Dagit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: RSS Sosyal Dagitimini Calistir
        run: python3 sync_rss.py ${{ inputs.dry_run == true && '--dry-run' || '' }}
        env:
          FORCE_RUN: ${{ inputs.force == true && 'true' || 'false' }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
